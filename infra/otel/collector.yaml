receivers:
  filelog/authentik:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: beginning
    include_file_path: true
    storage: file_storage
    attributes:
      hostname: authentik
      appname: authentik
    operators:
      - type: json_parser
        parse_to: attributes.docker
      - type: filter
        expr: 'attributes.docker.attrs == nil or attributes.docker.attrs["observability.logs"] != "authentik"'
      - type: container
      - type: remove
        field: attributes.docker
      - type: copy
        from: body
        to: attributes.message
      - type: add
        field: resource["service.name"]
        value: authentik
  filelog/applications:
    include:
      - /var/log/apps/*/app.json
    start_at: end
    storage: file_storage
    operators:
      - type: copy
        from: body
        to: attributes.message
      - type: json_parser
        parse_to: body
  filelog/traefik:
    include: [/var/log/traefik/access.json]
    start_at: end
    storage: file_storage
    attributes:
      hostname: traefik-access
      appname: traefik-access
    operators:
      - type: copy
        from: body
        to: attributes.message
      - type: json_parser
        parse_to: body
  filelog/traefik_internal:
    include: [/var/log/traefik/traefik.json]
    start_at: beginning
    storage: file_storage
    attributes:
      hostname: traefik-internal
      appname: traefik-internal
    operators:
      - type: copy
        from: body
        to: attributes.message
  filelog/waf:
    include: [/var/log/waf/audit.json]
    start_at: beginning
    storage: file_storage
    max_log_size: 1MiB
    multiline:
      line_start_pattern: '^\{'
    force_flush_period: 2s
    attributes:
      appname: modsecurity
      hostname: waf
    operators:
      - type: copy
        from: body
        to: attributes.message
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  transform/log_timestamp:
    error_mode: ignore
    log_statements:
      # Usa o horario de coleta quando o registro nao possui timestamp.
      - set(log.time, log.observed_time) where log.time_unix_nano == 0
      # Mantém cada auditoria em uma linha no Syslog TCP, sem perder o JSON.
      - replace_pattern(log.attributes["message"], "[\r\n]+", " ") where log.attributes["appname"] == "modsecurity"
  batch: {}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  syslog/graylog:
    endpoint: graylog
    port: 1514
    network: tcp
    protocol: rfc5424
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage

extensions:
  file_storage:
    directory: /var/lib/otelcol
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [filelog/applications, filelog/traefik, filelog/traefik_internal, filelog/waf, filelog/authentik]
      processors: [memory_limiter, transform/log_timestamp, batch]
      exporters: [syslog/graylog]
  extensions: [file_storage]
