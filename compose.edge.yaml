services:
  traefik:
    image: traefik:v3.6.4
    restart: unless-stopped
    command: [--configFile=/etc/traefik/traefik.yml]
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_logs:/logs
      - traefik_certs:/certs:ro
    networks:
      edge:
        aliases:
          - auth.hospital.lab
    depends_on:
      waf:
        condition: service_healthy
      cert-bootstrap:
        condition: service_completed_successfully
  cert-bootstrap:
    image: alpine:3.22
    restart: "no"
    entrypoint: [/bin/sh, /bootstrap/generate.sh]
    volumes:
      - ./infra/traefik/generate-cert.sh:/bootstrap/generate.sh:ro
      - ./infra/traefik/dynamic:/dynamic
      - traefik_certs:/certs
    networks: [edge]
  waf:
    image: owasp/modsecurity-crs:apache
    restart: unless-stopped
    environment:
      # O plugin consulta o WAF; este backend é somente o alvo interno de validação do CRS.
      BACKEND: http://waf-backend:80
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      REMOTEIP_HEADER: X-Real-IP
      REMOTEIP_INT_PROXY: 172.16.0.0/12
    networks: [edge]
    depends_on:
      waf-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "httpd -t"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
  waf-backend:
    image: nginxdemos/hello:plain-text
    restart: unless-stopped
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 5s
      timeout: 3s
      retries: 6
