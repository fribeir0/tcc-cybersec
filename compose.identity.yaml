services:
  authentik-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:?defina no .env}
    volumes: [authentik_postgres:/var/lib/postgresql/data]
    networks: [identity]
  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [authentik_redis:/data]
    networks: [identity]
  authentik-server:
    logging:
      driver: syslog
      options:
        syslog-address: udp://127.0.0.1:1515
        syslog-format: rfc5424micro
        tag: authentik-server
        mode: non-blocking
        max-buffer-size: 4m
    image: ghcr.io/goauthentik/server:2025.10.2
    restart: unless-stopped
    command: server
    environment: &authentik_env
      AUTHENTIK_LOG_LEVEL: info
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?defina no .env}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:?defina no .env}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?defina no .env}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?defina no .env}
    volumes: [authentik_media:/media, authentik_templates:/templates]
    networks: [edge, identity]
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentik.rule=Host(`auth.hospital.lab`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.tls=true
      - traefik.http.services.authentik.loadbalancer.server.port=9000
  authentik-worker:
    logging:
      driver: syslog
      options:
        syslog-address: udp://127.0.0.1:1515
        syslog-format: rfc5424micro
        tag: authentik-worker
        mode: non-blocking
        max-buffer-size: 4m
    image: ghcr.io/goauthentik/server:2025.10.2
    restart: unless-stopped
    command: worker
    environment: *authentik_env
    volumes: [/var/run/docker.sock:/var/run/docker.sock, authentik_media:/media, authentik_templates:/templates]
    networks: [identity]
  authentik-proxy:
    logging:
      driver: syslog
      options:
        syslog-address: udp://127.0.0.1:1515
        syslog-format: rfc5424micro
        tag: authentik-proxy
        mode: non-blocking
        max-buffer-size: 4m
    image: ghcr.io/goauthentik/proxy:2025.10.2
    restart: unless-stopped
    environment:
      AUTHENTIK_LOG_LEVEL: info
      AUTHENTIK_HOST: http://authentik-server:9000
      AUTHENTIK_HOST_BROWSER: https://auth.hospital.lab
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ${AUTHENTIK_OUTPOST_TOKEN:-bootstrap-pending}
    networks: [edge, identity, apps]
    labels:
      - traefik.enable=true
      - traefik.http.services.authentik-proxy.loadbalancer.server.port=9000
volumes:
  authentik_postgres: {}
  authentik_redis: {}
  authentik_media: {}
  authentik_templates: {}
